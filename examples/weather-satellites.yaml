# Weather-satellite ground station: track the weather / GOES groups and focus on
# the Meteor LRPT satellites (137.1 / 137.9 MHz), which /table plans pass by pass.
# Stars are off to keep cardinality down; the Sun/Moon stay useful for day/night
# and illumination.

observer_name: station
observer_lat: 50.0755
observer_lon: 14.4378
observer_elevation_m: 200
min_elevation_deg: 10                       # only reckon passes above 10°

sat_enabled: true
sat_groups: [weather, goes]                 # CelesTrak no longer has a `noaa` group
sat_watchlist: [25544]                      # ISS
sat_focus: [57166, 59051]                   # METEOR-M2 3, METEOR-M2 4
sat_focus_min_elevation_deg: 30             # ★ good pass + SatelliteFocusGoodPass alert
celestrak_format: tle
tle_refresh_hours: 6
pass_lookahead_hours: 24

bodies: [sun, moon]
stars: []

space_weather_enabled: true

port: 9110
